<!-- Source de l'appli CHAUFFEUR. Ne pas publier ce fichier : lancer construire-chauffeur.ps1,
     qui y ajoute le moteur de carte et les icônes de l'appli client, et publier appli-bda-chauffeur.html. -->
<style>
/* Appli chauffeur BDA : même univers noir et sobre que l'appli client, pensée pour être lue d'un coup d'œil en conduisant. */
:root { --page: #050505; --display: "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --texte-police: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --ease: cubic-bezier(0.2, 0.8, 0.2, 1); color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); background-image: radial-gradient(800px 560px at 50% 0%, #161616 0%, rgba(5, 5, 5, 0) 70%); color: #fff; font-family: var(--texte-police); font-size: 15px; line-height: 1.45; display: grid; place-items: center; overflow: hidden; padding-inline: 16px; -webkit-font-smoothing: antialiased; }
.appareil {
  --fond: #000; --feuille: #101010; --surface: #161616; --surface-2: #222; --surface-3: #2e2e2e; --texte: #fff; --texte-2: #a7a7a7; --texte-3: #6f6f6f; --ligne: rgba(255, 255, 255, 0.09);
  --principal: #fff; --sur-principal: #000; --or: #c9a66b; --or-clair: #e2cb9a; --rouge: #e5484d; --vert: #3fb27f; --ombre: 0 18px 50px rgba(0, 0, 0, 0.6); --verre: rgba(28, 28, 28, 0.86);
  position: relative; width: min(410px, 100%); height: min(860px, calc(100% - 36px)); border-radius: 46px; overflow: hidden; background: var(--fond); color: var(--texte); isolation: isolate; container-type: size;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 0 0 11px #0d0d0d, 0 0 0 12px rgba(255, 255, 255, 0.07), 0 50px 120px -30px rgba(0, 0, 0, 0.95); color-scheme: dark;
}
.appareil[data-mode="clair"] { --fond: #fff; --feuille: #fff; --surface: #f3f3f3; --surface-2: #ebebeb; --surface-3: #dedede; --texte: #000; --texte-2: #5e5e5e; --texte-3: #8d8d8d; --ligne: rgba(0, 0, 0, 0.08); --principal: #000; --sur-principal: #fff; --or: #a8834b; --or-clair: #8a6a3a; --ombre: 0 16px 40px rgba(0, 0, 0, 0.16); --verre: rgba(255, 255, 255, 0.9); color-scheme: light; }
@media (max-width: 520px) { body { padding-inline: 0; } .appareil { width: 100%; height: 100%; border-radius: 0; box-shadow: none; } }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; text-align: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-s { width: 18px; height: 18px; } .ic-xs { width: 15px; height: 15px; }
#carte { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; transition: transform 0.7s var(--ease); transform-origin: 50% var(--gps-y, 60%); }
.vue-gps #carte { transform: perspective(760px) rotateX(54deg) scale(1.6); }
.appareil::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.7s; background: linear-gradient(to bottom, var(--fond) 0%, var(--fond) 44%, color-mix(in srgb, var(--fond) 55%, transparent) 70%, transparent 100%); }
.appareil.vue-gps::before { opacity: 1; }
.carte-etat { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); z-index: 5; height: 32px; padding: 0 14px; border-radius: 99px; display: inline-flex; align-items: center; background: var(--feuille); color: var(--texte-2); font: 600 12.5px/1 var(--texte-police); box-shadow: var(--ombre); }

/* haut de l'écran : statut et gains du jour */
.haut { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 6; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.statut-pastille { display: inline-flex; align-items: center; gap: 9px; height: 44px; padding: 0 16px 0 12px; border-radius: 99px; background: var(--feuille); box-shadow: var(--ombre); font: 800 14px/1 var(--display); }
.statut-pastille i { width: 10px; height: 10px; border-radius: 50%; background: var(--texte-3); }
.statut-pastille.en-ligne i { background: var(--vert); box-shadow: 0 0 0 0 rgba(63, 178, 127, 0.6); animation: pouls 2s infinite; }
@keyframes pouls { 70% { box-shadow: 0 0 0 8px rgba(63, 178, 127, 0); } 100% { box-shadow: 0 0 0 0 rgba(63, 178, 127, 0); } }
.gains-pastille { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 99px; background: var(--principal); color: var(--sur-principal); box-shadow: var(--ombre); font: 800 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.btn-gps { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--feuille); box-shadow: var(--ombre); font: 800 13px/1 var(--display); }

/* consigne de navigation */
.consigne { position: absolute; top: 70px; left: 14px; right: 14px; z-index: 6; display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #0b0b0b; color: #fff; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(201, 166, 107, 0.35); animation: monte-bas 0.4s var(--ease) both; }
@keyframes monte-bas { from { transform: translateY(-14px); opacity: 0; } }
.consigne .fleche-nav { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--or); color: #000; }
.consigne .fleche-nav .ic { width: 30px; height: 30px; stroke-width: 2.4; }
.consigne b { display: block; font: 800 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.consigne span { display: block; margin-top: 3px; font: 600 15px/1.2 var(--texte-police); color: #d8d2c4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.consigne small { display: block; margin-top: 4px; color: #8f897c; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* panneau du bas */
.feuille { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; max-height: calc(100% - 140px); overflow-y: auto; scrollbar-width: none; background: var(--feuille); border-radius: 24px 24px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.35); padding: 10px 18px 104px; animation: monte 0.4s var(--ease) both; }
.feuille.sans-nav { padding-bottom: 22px; }
.feuille::-webkit-scrollbar { display: none; }
@keyframes monte { from { transform: translateY(30px); opacity: 0.3; } }
.poignee { width: 40px; height: 5px; border-radius: 5px; background: var(--surface-3); margin: 0 auto 14px; }
.pile { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.titre-feuille { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.titre-feuille h2 { margin: 0; font: 800 22px/1.15 var(--display); letter-spacing: -0.02em; }
.titre-feuille span { font: 800 17px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sous { margin: 0; color: var(--texte-2); font-size: 14px; }
.petit { margin: 0; color: var(--texte-3); font-size: 12px; }
.centre { text-align: center; }
.btn { width: 100%; height: 58px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 700 17px/1 var(--texte-police); transition: transform 0.15s; }
.btn:active { transform: scale(0.985); }
.btn-principal { background: var(--principal); color: var(--sur-principal); }
.btn-second { background: var(--surface); color: var(--texte); }
.btn-vert { background: var(--vert); color: #04140c; }
.btn-or { background: linear-gradient(135deg, #e2cb9a, #c9a66b); color: #1a1206; }
.btn-lien { height: 44px; color: var(--texte-2); font-weight: 600; font-size: 14.5px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tuiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tuile { display: grid; gap: 4px; padding: 12px; border-radius: 14px; background: var(--surface); }
.tuile b { font: 800 19px/1 var(--display); font-variant-numeric: tabular-nums; }
.tuile small { color: var(--texte-2); font-size: 12px; }
.client { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--surface); }
.avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 800 19px/1 var(--display); }
.client b { display: block; font: 700 16px/1.2 var(--display); }
.client small { display: block; color: var(--texte-2); font-size: 12.5px; margin-top: 2px; }
.etoile { display: inline-flex; align-items: center; gap: 3px; color: var(--texte-2); font: 600 12.5px/1 var(--texte-police); }
.etoile .ic { width: 13px; height: 13px; fill: var(--or); stroke: none; }
.actions { display: flex; gap: 8px; }
.rond { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); position: relative; }
.pastille-nb { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center; background: var(--or); color: #000; font: 800 10.5px/1 var(--texte-police); }
.trajet { display: grid; gap: 2px; }
.trajet > div { display: grid; grid-template-columns: 18px 1fr; gap: 12px; align-items: start; padding: 4px 0; font-size: 14.5px; }
.trajet small { display: block; color: var(--texte-2); font-size: 12.5px; }
.pt { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: var(--texte); }
.pt-carre { border-radius: 2px; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 99px; background: var(--surface-2); font: 600 12.5px/1 var(--texte-police); }
.puce.or { background: rgba(201, 166, 107, 0.16); color: var(--or-clair); }
.barre { height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.barre i { display: block; height: 100%; width: 0; background: var(--texte); border-radius: 4px; transition: width 0.25s linear; }
.cases-code { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cases-code input { height: 66px; width: 100%; border-radius: 14px; border: 2px solid transparent; background: var(--surface); text-align: center; font: 800 28px/1 var(--display); color: var(--texte); }
.cases-code input:focus { outline: none; border-color: var(--or); }
.code-unique { height: 72px; width: 100%; border-radius: 16px; border: 2px solid transparent; background: var(--surface); text-align: center; font: 800 34px/1 var(--display); letter-spacing: 0.5em; padding-left: 0.5em; color: var(--texte); }
.code-unique:focus { outline: none; border-color: var(--or); }
.erreur { margin: 0; color: var(--rouge); font-size: 13px; }

/* offre de course */
.offre { position: absolute; left: 12px; right: 12px; bottom: 96px; z-index: 30; display: grid; gap: 14px; padding: 18px; border-radius: 26px; background: #0b0b0b; color: #fff; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(201, 166, 107, 0.45); animation: offre-entre 0.5s var(--ease) both; }
@keyframes offre-entre { from { transform: translateY(40px) scale(0.96); opacity: 0; } }
.offre-haut { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.offre-haut .type { display: inline-flex; align-items: center; gap: 8px; font: 800 13px/1 var(--texte-police); letter-spacing: 0.12em; text-transform: uppercase; color: var(--or-clair); }
.minuteur { position: relative; width: 52px; height: 52px; }
.minuteur svg { width: 52px; height: 52px; transform: rotate(-90deg); }
.minuteur circle { fill: none; stroke-width: 4; }
.minuteur .f { stroke: #2a2a2a; }
.minuteur .v { stroke: var(--or); stroke-linecap: round; stroke-dasharray: 144.5; transition: stroke-dashoffset 0.25s linear; }
.minuteur span { position: absolute; inset: 0; display: grid; place-items: center; font: 800 17px/1 var(--display); font-variant-numeric: tabular-nums; }
.offre-prix { font: 800 44px/1 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.offre-prix small { display: block; margin-top: 6px; font: 600 13px/1.3 var(--texte-police); color: #a69f90; letter-spacing: 0; }
.offre .trajet small { color: #a69f90; }
.offre .pt { background: #fff; }
.offre .puce { background: #1f1f1f; color: #e8e2d4; }
.offre .duo .btn-second { background: #1c1c1c; color: #fff; }

/* pages : gains, messages, profil */
.page { position: absolute; inset: 0; z-index: 7; overflow-y: auto; scrollbar-width: none; background: var(--fond); }
.page::-webkit-scrollbar { display: none; }
.p { padding: 22px 18px 120px; display: grid; gap: 18px; animation: entre 0.35s var(--ease) both; }
@keyframes entre { from { opacity: 0.4; transform: translateY(8px); } }
.grand-titre { margin: 4px 0 0; font: 800 34px/1.05 var(--display); letter-spacing: -0.03em; }
.sect { margin: 6px 0 -6px; font: 800 19px/1.2 var(--display); letter-spacing: -0.015em; }
.gros-gain { display: grid; gap: 6px; padding: 18px; border-radius: 20px; background: radial-gradient(120% 120% at 100% 0%, rgba(201, 166, 107, 0.2), transparent 60%), var(--surface); }
.gros-gain b { font: 800 40px/1 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.gros-gain small { color: var(--texte-2); font-size: 13px; }
.semaine { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; gap: 8px; height: 150px; padding: 14px 12px 10px; border-radius: 18px; background: var(--surface); }
.semaine div { display: grid; justify-items: center; gap: 6px; height: 100%; align-content: end; }
.semaine i { display: block; width: 100%; max-width: 26px; border-radius: 7px 7px 3px 3px; background: var(--surface-3); }
.semaine div.auj i { background: linear-gradient(to top, var(--or), var(--or-clair)); }
.semaine span { font: 600 11px/1 var(--texte-police); color: var(--texte-3); }
.ligne { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; width: 100%; text-align: left; border-bottom: 1px solid var(--ligne); }
.ligne:last-child { border-bottom: 0; }
.ligne .pastille { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); }
.ligne b { display: block; font: 600 15px/1.3 var(--texte-police); }
.ligne small { display: block; color: var(--texte-2); font-size: 13px; margin-top: 2px; }
.ligne .droite { font: 800 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.statut-doc { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 6px; font: 700 10.5px/1 var(--texte-police); letter-spacing: 0.06em; text-transform: uppercase; }
.statut-doc.ok { background: rgba(63, 178, 127, 0.15); color: var(--vert); }
.statut-doc.bientot { background: rgba(201, 166, 107, 0.16); color: var(--or-clair); }
.carte-pro { position: relative; display: grid; gap: 14px; padding: 18px; border-radius: 20px; overflow: hidden; color: #f3ead6;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 3px), linear-gradient(135deg, #0a0a0a 0%, #262626 48%, #0d0d0d 100%); box-shadow: inset 0 0 0 1px rgba(201, 166, 107, 0.45); }
.carte-pro .haut-cp { display: flex; justify-content: space-between; align-items: baseline; }
.carte-pro .haut-cp b { font: 800 18px/1 var(--display); letter-spacing: 0.1em; }
.carte-pro .haut-cp span { font: 600 10.5px/1 var(--texte-police); letter-spacing: 0.24em; text-transform: uppercase; color: var(--or-clair); }
.carte-pro .qui { display: flex; align-items: center; gap: 14px; }
.carte-pro .qui .avatar { background: #2b2b2b; box-shadow: inset 0 0 0 1px rgba(201, 166, 107, 0.5); color: #fff; }
.carte-pro .qui b { display: block; font: 800 22px/1.1 var(--display); color: #fff; }
.carte-pro .qui small { display: block; margin-top: 4px; color: #b9b2a3; font-size: 13px; }
.plaque { font: 800 13px/1 var(--display); letter-spacing: 0.05em; color: #111; background: #f4f4f2; border-radius: 6px; padding: 6px 8px; border-left: 7px solid #2b4fb5; white-space: nowrap; justify-self: start; }
.interrupteur { width: 52px; height: 32px; border-radius: 99px; background: var(--surface-3); position: relative; flex: none; transition: background 0.2s; }
.interrupteur::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform 0.25s var(--ease); }
.interrupteur[aria-checked="true"] { background: var(--vert); }
.interrupteur[aria-checked="true"]::after { transform: translateX(20px); }
.numero { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--surface); }
.numero b { font: 800 18px/1 var(--display); }

/* messagerie */
.chat { position: absolute; inset: 0; z-index: 45; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto; background: var(--fond); animation: entre 0.3s var(--ease) both; }
.chat-tete { display: grid; grid-template-columns: 44px 44px minmax(0, 1fr) 44px; align-items: center; gap: 10px; padding: 14px 14px 10px; border-bottom: 1px solid var(--ligne); }
.chat-tete .avatar { width: 44px; height: 44px; font-size: 16px; }
.chat-tete b { display: block; font: 800 16px/1.2 var(--display); }
.chat-tete small { display: block; color: var(--texte-2); font-size: 12.5px; }
.chat-info { margin: 0; padding: 8px; color: var(--texte-3); font-size: 11.5px; text-align: center; }
.chat-liste { overflow-y: auto; padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
.chat-vide { margin: auto; color: var(--texte-3); font-size: 13.5px; text-align: center; max-width: 26ch; }
.bulle-msg { max-width: 78%; display: grid; gap: 3px; }
.bulle-msg p { margin: 0; padding: 10px 13px; border-radius: 18px; font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }
.bulle-msg small { font-size: 10.5px; color: var(--texte-3); padding: 0 6px; }
.bulle-msg.de-chauffeur { align-self: flex-end; justify-items: end; }
.bulle-msg.de-chauffeur p { background: var(--principal); color: var(--sur-principal); border-bottom-right-radius: 6px; }
.bulle-msg.de-client { align-self: flex-start; }
.bulle-msg.de-client p { background: var(--surface-2); border-bottom-left-radius: 6px; }
.chat-rapides { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 6px 14px; }
.chat-rapides button { flex: none; height: 34px; padding: 0 13px; border-radius: 99px; background: var(--surface); font: 600 13px/1 var(--texte-police); }
.chat-saisie { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 8px; padding: 8px 14px 16px; }
.chat-saisie input { height: 48px; min-width: 0; padding: 0 16px; border-radius: 99px; border: 2px solid transparent; background: var(--surface); font: 500 15.5px/1 var(--texte-police); }
.chat-saisie input:focus { outline: none; border-color: var(--texte); }
.chat-envoyer { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--principal); color: var(--sur-principal); }
.bouton-rond { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); }

/* barre du bas */
.nav { position: absolute; left: 50%; bottom: 16px; z-index: 20; transform: translateX(-50%); width: calc(100% - 28px); max-width: 360px; height: 68px; padding: 6px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; border-radius: 99px; background: var(--verre); border: 1px solid var(--ligne); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: var(--ombre); }
.nav button { border-radius: 99px; display: grid; justify-items: center; align-content: center; gap: 4px; font: 600 11.5px/1 var(--texte-police); color: var(--texte-2); position: relative; }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--texte); }
.nav .point { position: absolute; top: 9px; left: calc(50% + 6px); width: 9px; height: 9px; border-radius: 50%; background: var(--or); border: 2px solid var(--fond); }

/* connexion */
.connexion { position: absolute; inset: 0; z-index: 60; display: grid; align-content: end; gap: 14px; padding: 26px 22px 34px; background: radial-gradient(90% 60% at 50% 18%, rgba(201, 166, 107, 0.18), transparent 70%), #000; color: #fff; }
.connexion .logo { align-self: center; justify-self: center; margin-bottom: auto; margin-top: 18cqh; text-align: center; }
.connexion .logo b { display: block; font: 800 64px/1 var(--display); letter-spacing: 4px; }
.connexion .logo span { display: block; margin-top: 10px; font: 600 11px/1 var(--texte-police); letter-spacing: 0.42em; padding-left: 0.42em; color: var(--or-clair); }
.connexion h1 { margin: 0; font: 800 26px/1.15 var(--display); letter-spacing: -0.02em; }
.connexion p { margin: 0; color: #a7a7a7; font-size: 14px; }
.connexion .champ-faux { height: 56px; border-radius: 14px; padding: 0 16px; display: flex; align-items: center; background: #161616; color: #6f6f6f; font-size: 16px; }

.toast { position: absolute; left: 14px; right: 14px; top: 16px; z-index: 70; display: flex; gap: 10px; align-items: flex-start; padding: 13px 15px; border-radius: 14px; background: var(--principal); color: var(--sur-principal); font-size: 13.5px; line-height: 1.4; box-shadow: var(--ombre); opacity: 0; transform: translateY(-10px); transition: opacity 0.3s, transform 0.3s var(--ease); pointer-events: none; }
.toast.visible { opacity: 1; transform: none; }
.voile { position: absolute; inset: 0; z-index: 65; display: grid; align-items: end; background: rgba(0, 0, 0, 0.55); }
.modale { display: grid; gap: 14px; padding: 12px 18px 22px; border-radius: 24px 24px 0 0; background: var(--feuille); animation: monte 0.35s var(--ease) both; }
.modale h2 { margin: 0; font: 800 21px/1.2 var(--display); }
.modale p { margin: 0; color: var(--texte-2); font-size: 14px; }
.etoiles { display: flex; justify-content: center; gap: 6px; }
.etoiles button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--surface-3); }
.etoiles button .ic { width: 30px; height: 30px; fill: currentColor; stroke: none; }
.etoiles button[aria-pressed="true"] { color: var(--or); }
.coche { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; background: var(--principal); color: var(--sur-principal); justify-self: center; }
.coche .ic { width: 30px; height: 30px; stroke-width: 2.4; }
@media (prefers-reduced-motion: reduce) { .p, .feuille, .offre, .consigne, .modale, .chat { animation: none; } #carte { transition: none; } }
/* maquette ou vraie appli reliée au serveur BDA */
.reel .demo-seul { display: none !important; }
.demo .reel-seul { display: none !important; }
.champ { display: grid; gap: 7px; min-width: 0; }
.champ > span { font: 600 13px/1 var(--texte-police); color: var(--texte-2); }
.champ input, .connexion input { width: 100%; min-width: 0; height: 56px; padding: 0 16px; border-radius: 14px; border: 2px solid transparent; background: #161616; color: #fff; font: 500 16px/1 var(--texte-police); }
.appareil[data-mode="clair"] .champ input { background: var(--surface); color: var(--texte); }
.champ input:focus, .connexion input:focus { outline: none; border-color: var(--or); }
.connexion .erreur { color: #ff8a8d; }
.connexion a { color: #a7a7a7; font-size: 13.5px; text-align: center; }
.alerte-gps { position: absolute; top: 66px; left: 14px; right: 14px; z-index: 7; padding: 11px 14px; border-radius: 14px; background: #2a1414; color: #ffc2c2; font-size: 13px; line-height: 1.4; box-shadow: var(--ombre); }
.choix-gammes { display: flex; flex-wrap: wrap; gap: 8px; }
.choix-gammes button { height: 40px; padding: 0 15px; border-radius: 99px; background: var(--surface-2); font: 600 13.5px/1 var(--texte-police); }
.choix-gammes button[aria-pressed="true"] { background: var(--principal); color: var(--sur-principal); }
.doc-bon { display: grid; gap: 9px; padding: 14px; border-radius: 16px; background: var(--surface); }
.doc-bon > b { font: 800 15px/1.2 var(--display); }
.doc-bon div { display: flex; justify-content: space-between; gap: 14px; font-size: 13.5px; }
.doc-bon span { color: var(--texte-2); flex: none; }
.doc-bon div b { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
.resa { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface); }
.resa .haut-resa { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.resa .haut-resa b { font: 800 16px/1.2 var(--display); }
.resa .haut-resa span { font: 800 17px/1 var(--display); }

      try {
        const r = await api('chauffeur.connexion', { identifiant: id.trim(), motdepasse: mdp });
        jeton = r.jeton; ecrire('bda-chauffeur-jeton', jeton); etat.connecte = true;
        $('#connexion').hidden = true; son('ok');
        await chargerProfil(); interrogerServeur(); activerNotifications(true);
        toast(`Bonjour ${CHAUFFEUR.prenom} ! Passez en ligne pour recevoir des courses.`);
      } catch (e) { vueConnexionReelle(e.message, id); }
    },
    async deconnexion() {
      if (etat.course) { toast('Terminez d’abord la course en cours.'); return; }
      let endpoint = '';
      try { const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null; const abo = reg && await reg.pushManager.getSubscription(); if (abo) { endpoint = abo.endpoint; abo.unsubscribe().catch(() => {}); } } catch { /* pas d'abonnement */ }
      await api('chauffeur.deconnexion', { endpoint }).catch(() => {});
      deconnexionLocale();
    },
    basculerLigne() {
      if (etat.course) { toast('Terminez d’abord la course en cours.'); return; }
      const veut = !etat.enLigne;
      if (veut && !CHAUFFEUR.plaque) { aller('profil'); toast('Renseignez d’abord votre véhicule.'); return; }
      son('clic'); demandeLigne = veut; etat.enLigne = veut;
      if (veut) { demarrerGps(); garderEcran(); } else { arreterGps(); relacherEcran(); etat.offre = null; afficherOffre(); }
      aller('carte'); interrogerServeur();
    },
    async accepterOffre() {
      const o = etat.offre;
      if (!o) return;
      etat.offre = null; afficherOffre();
      try { const { course } = await api('course.accepter', { numero: o.numero }); son('ok'); prendreCourse(course); }
      catch (e) { refusees.add(o.numero); toast(e.message); }
    },
    refuserOffre() {
      const o = etat.offre;
      if (!o) return;
      refusees.add(o.numero); etat.offre = null; afficherOffre();
      api('course.refuser', { numero: o.numero }).catch(() => {});
      toast('Course refusée. Une autre vous sera proposée.');
    },
    async arrive() {
      const c = etat.course;
      try { await api('course.arrivee', { numero: c.numero }); c.attente0 = Date.now(); son('ding'); aller('attente'); } catch (e) { toast(e.message); }
    },
    clientABord() {
      const c = etat.course;
      if (!c.code) { demarrerReel(''); return; }
      modale(`<h2>Code de sécurité</h2><p>Demandez à ${esc(c.client)} son code à 4 chiffres (il le voit dans son appli).</p>
        <input class="code-unique" id="code-saisi" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="····" aria-label="Code à 4 chiffres"><p class="erreur" id="code-erreur" hidden></p>
        <button class="btn btn-or" type="button" data-a="validerCode">Démarrer la course</button>`);
      setTimeout(() => { const i = $('#code-saisi'); if (i) i.focus(); }, 80);
    },
    validerCode() {
      const code = (($('#code-saisi') || {}).value || '').replace(/\D/g, '');
      if (code.length !== 4) { const er = $('#code-erreur'); er.hidden = false; er.textContent = 'Le code contient 4 chiffres.'; return; }
      demarrerReel(code);
    },
    clientAbsent() { modale(`<h2>Client absent ?</h2><p>Après l’attente offerte (${etat.course.attente || 5} min), vous pouvez annuler. Le client est prévenu et BDA applique les conditions d’annulation. Essayez d’abord de l’appeler.</p><button class="btn btn-principal" type="button" data-a="annulerAbsent">Annuler la course</button><button class="btn btn-second" type="button" data-a="appeler">Appeler le client</button><button class="btn btn-lien" type="button" data-a="fermerModale" data-v="ok">Continuer d’attendre</button>`); },
    async annulerAbsent() {
      const c = etat.course;
      try { await api('course.absent', { numero: c.numero }); fermerModale(); etat.course = null; fermerChat(); toast('Course annulée : client absent.'); aller('carte'); }
      catch (e) { fermerModale(); toast(e.message); }
    },
    async terminer() {
      const c = etat.course;
      try { await api('course.terminer', { numero: c.numero }); son('ok'); fermerChat(); historique = null; aller('fin'); interrogerServeur(); }
      catch (e) { toast(e.message); }
    },
    noteClient(n) { const c = etat.course; c.noteClient = +n; son('clic'); rendu(); api('course.noterClient', { numero: c.numero, note: +n }).catch(() => {}); },
    repasserEnLigne() { etat.course = null; fermerChat(); if (!etat.enLigne) { arreterGps(); relacherEcran(); } aller('carte'); interrogerServeur(); },
    appeler() {
      const tel = etat.course && etat.course.tel;
      if (!tel) { toast('Numéro du client indisponible : écrivez-lui un message.'); return; }
      location.href = `tel:${String(tel).replace(/[^\d+]/g, '')}`;
    },
    voirBon() { const c = etat.course; if (c) modale(`<h2>Bon de réservation</h2><p>À présenter en cas de contrôle : il prouve que la course a été réservée à l’avance.</p>${htmlBonChauffeur(c)}<button class="btn btn-second" type="button" data-a="fermerModale" data-v="ok">Fermer</button>`); },
    abandonner() {
      modale(`<h2>Rendre la course ?</h2><p>Elle sera proposée tout de suite à un autre chauffeur et le client sera prévenu. À utiliser seulement en cas d’imprévu (panne, accident, urgence).</p>
        <button class="btn btn-principal" type="button" data-a="confirmerAbandon">Rendre la course</button><button class="btn btn-second" type="button" data-a="fermerModale" data-v="ok">Je continue</button>`);
    },
    async confirmerAbandon() {
      const c = etat.course;
      try { await api('course.abandonner', { numero: c.numero, motif: 'imprévu du chauffeur' }); fermerModale(); etat.course = null; fermerChat(); aller('carte'); toast('Course rendue : elle est proposée à un autre chauffeur.'); interrogerServeur(); }
      catch (e) { fermerModale(); toast(e.message); }
    },
    voirReservations(v) {
      const liste = v === 'm' ? etat.mesReservations : etat.reservations;
      const date = (s) => { const d = dateServeur(s); return `${d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' })} à ${heure(d)}`; };
      modale(`<h2>${v === 'm' ? 'Mes réservations' : 'Réservations à accepter'}</h2>
        ${liste.length ? liste.map((r) => `<div class="resa"><div class="haut-resa"><b>${esc(date(r.quand))}</b><span>${euros(r.prix + (r.protection || 0))}</span></div>
          <div class="trajet"><div><span class="pt"></span><span>${esc(r.depart.titre)}<small>${esc(r.depart.sous)}</small></span></div><div><span class="pt pt-carre"></span><span>${r.arrivee ? esc(r.arrivee.titre) : `À disposition ${esc(r.heures)} h`}</span></div></div>
          <div class="puces"><span class="puce">${esc(r.gammeNom)}</span><span class="puce">${esc(r.client.prenom)}</span>${r.options.map((x) => `<span class="puce">${esc(x)}</span>`).join('')}</div>
          ${v === 'm' ? `<button class="btn btn-or" type="button" data-a="partir" data-v="${esc(r.numero)}">Partir chercher le client</button>` : `<button class="btn btn-or" type="button" data-a="accepterResa" data-v="${esc(r.numero)}">Accepter la réservation</button>`}</div>`).join('') : '<p>Aucune réservation pour le moment.</p>'}
        <button class="btn btn-second" type="button" data-a="fermerModale" data-v="ok">Fermer</button>`);
    },
    async accepterResa(numero) {
      try { await api('course.accepter', { numero }); fermerModale(); son('ok'); toast('Réservation acceptée : elle est dans « confirmées ». Le client est prévenu.'); interrogerServeur(); }
      catch (e) { toast(e.message); }
    },
    async partir(numero) {
      try { const { course } = await api('course.partir', { numero }); fermerModale(); prendreCourse(course); }
      catch (e) { toast(e.message); }
    },
    gammeVehicule(v) {
      const g = new Set(CHAUFFEUR.gammes || []);
      if (g.has(v)) g.delete(v); else g.add(v);
      CHAUFFEUR.voiture = ($('#vh-modele') || {}).value || CHAUFFEUR.voiture; CHAUFFEUR.couleur = ($('#vh-couleur') || {}).value || CHAUFFEUR.couleur; CHAUFFEUR.plaque = ($('#vh-plaque') || {}).value || CHAUFFEUR.plaque;
      CHAUFFEUR.gammes = [...g]; rendu();
    },
    async enregistrerVehicule() {
      const modele = $('#vh-modele').value.trim(), couleur = $('#vh-couleur').value.trim(), plaque = $('#vh-plaque').value.trim().toUpperCase();
      try { await api('chauffeur.vehicule', { modele, couleur, plaque, gammes: (CHAUFFEUR.gammes || []).filter((x) => x !== 'vip') }); toast('Véhicule enregistré.'); await chargerProfil(); }
      catch (e) { toast(e.message); }
    },
    activerNotifs() { activerNotifications(false); },
  };
  // envoi du code (ou démarrage direct) au serveur
  async function demarrerReel(code) {
    const c = etat.course;
    try { await api('course.demarrer', { numero: c.numero, code }); fermerModale(); son('ok'); aller('course'); }
    catch (e) { const er = $('#code-erreur'); if (er) { er.hidden = false; er.textContent = e.message; } else toast(e.message); }
  }
  // messagerie : envoi au serveur, les réponses du client arrivent avec l'échange toutes les 3 secondes
  if (REEL) transportMessages.envoyer = (numero, m) => {
    api('course.message', { numero, texte: m.texte, apres: dernierMsg() }).then((r) => { for (const x of r.messages) recevoirMessage(x); }).catch((e) => toast(`Message non envoyé : ${e.message}`));
  };
  if (REEL) Object.assign(actions, actionsReelles);

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-a]');
    if (!el || !actions[el.dataset.a]) return;
    if (el.dataset.a !== 'fermerModale') { e.preventDefault(); e.stopPropagation(); }
    actions[el.dataset.a](el.dataset.v, el, e);
  });
  document.addEventListener('input', (e) => {
    const m = /^code-(\d)$/.exec(e.target.id || '');
    if (m && e.target.value) { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 1); const n = $(`#code-${+m[1] + 1}`); if (n && e.target.value) n.focus(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'chat-texte') actions.envoyerMessage();
    if (e.key === 'Enter' && REEL && (e.target.id === 'cx-id' || e.target.id === 'cx-mdp')) actions.connexionReelle();
    if (e.key === 'Enter' && e.target.id === 'code-saisi') actions.validerCode();
    if (e.key === 'Escape' && couche.innerHTML) fermerModale();
  });

  /* ================= Démarrage ================= */
  if (location.hostname === 'localhost') window.__chauffeur = { etat, actions, pos, moteur };
  if (etat.connecte) $('#connexion').hidden = true;
  setInterval(majDirect, 200);
  requestAnimationFrame(boucle);
  demarrerMoteur();
  rendu();
  if (REEL) {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
    if (jeton) { chargerProfil().then(() => interrogerServeur()); activerNotifications(true); }
    else { vueConnexionReelle(); $('#connexion').hidden = false; }
  }
  chargerCarte();
})();
</script>

</body>
</html>
