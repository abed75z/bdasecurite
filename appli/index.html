      ${k === 'vip' ? `<p class="conditions mention-cnaps">Protection assurée et facturée par ${esc(LEGAL.protection)}, autorisation CNAPS n° ${aCompleter(LEGAL.cnaps)}. ${MENTION_CNAPS}</p>` : ''}
      <button class="paiement" type="button" data-a="choisirPaiement">${logoPaiement(etat.paiement)}<span class="nom-carte">${nomPaiement(etat.paiement)}</span>${ic('chevron', 'ic-s')}</button>
      <p class="conditions">${conditions} <button type="button" data-a="lireTexte" data-v="cgv">Conditions de vente</button></p>
      ${glissiere(libelle, !!it)}
    </div>`;
  }
  // « Glisser pour commander » : on pousse le rond jusqu'au bout
  const glissiere = (libelle, actif) => `<div class="glisser ${actif ? '' : 'inactif'}" id="glisser" role="slider" tabindex="0" aria-label="${esc(libelle)} : faites glisser vers la droite pour confirmer" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="gl-remplissage"></span><span class="gl-texte">${esc(libelle)}</span><span class="gl-bouton">${ic('fleche')}</span></div>`;
  function vuePointer() {

      : e === 'arrive' ? [`${c.chauffeur.prenom} est là`, `${c.chauffeur.voiture} · ${c.chauffeur.plaque}`]
      : ['En route', `${reste} min · arrivée ${heure(c.arriveePrevue)}`];

  function majDirect() {
    const e = etat.ecran, c = etat.course, eta = $('#eta'), barre = $('#barre');
    let p = 0, reste = 0;
    // vraie appli : c'est le serveur qui fait passer d'un écran à l'autre (chauffeur arrivé, course démarrée…)
    if (c && c.reel) {
      if (e === 'approche') { p = fApproche(c); reste = Math.max(1, c.minApproche || 1); }
      else if (e === 'course') { p = fCourse(c); reste = Math.max(1, c.reste || c.min || 1); }
      if (eta && (e === 'approche' || e === 'course')) eta.textContent = `${reste} min`;
      if (barre) barre.style.width = `${Math.round(p * 100)}%`;
      majIlot(e, c, p, reste);
      return;
    }
    if (e === 'approche' && c && c.tA0) {
      p = avance(c.tA0, c.dA); reste = Math.max(1, Math.ceil((1 - p) * c.minApproche));
      if (eta) eta.textContent = `${reste} min`;
      if (barre) barre.style.width = `${Math.round(p * 100)}%`;
      if (p >= 1) { aller('arrive'); son('ding'); messageAuto('arrive'); return; }
    } else if (e === 'course' && c && c.tC0) {
      p = avance(c.tC0, c.dC); reste = Math.max(1, Math.ceil((1 - p) * c.min));
      if (eta) eta.textContent = `${reste} min`;
      if (barre) barre.style.width = `${Math.round(p * 100)}%`;
      if (p >= 1) { aller('fin'); return; }
    }
    majIlot(e, c, p, reste);
  }

    partagerCode() {

    planifier() {
      const d = etat.planif || (() => { const x = new Date(); x.setDate(x.getDate() + 1); x.setHours(8, 0, 0, 0); return x; })();

        <div class="duo"><label class="champ"><span>Date</span><input id="pl-date" type="date" value="${enDate(d)}" min="${enDate(new Date())}"></label><label class="champ"><span>Heure</span><input id="pl-heure" type="time" value="${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}"></label></div>
        <button class="btn btn-principal" type="button" data-a="confirmerPlanif">Choisir cet horaire</button>
        ${etat.planif ? '<button class="btn btn-second" type="button" data-a="sansPlanif">Partir maintenant</button>' : ''}`);
    },
    confirmerPlanif() {
      const d = new Date(`${val('#pl-date')}T${val('#pl-heure') || '08:00'}:00`);
      if (Number.isNaN(d.getTime()) || d.getTime() < Date.now() + 30 * 60000) { toast('Choisissez un horaire au moins 30 minutes après maintenant.'); return; }
      etat.planif = d; fermerModale();
      if (['accueil', 'destination', 'choix'].includes(etat.ecran)) rendu(null, true); else { etat.pile = []; aller('accueil'); }
      toast(`Réservation pour ${textePlanif(d).toLowerCase()}. Choisissez votre destination.`);
    },
    sansPlanif() { etat.planif = null; fermerModale(); rendu(null, true); },
    disposition() {
      const d = etat.dispo, gammes = ['berline', 'luxe', 'van'].filter((k) => HEURE_DISPO[k] && VEHICULES[k].actif !== false);
      if (!gammes.length) { toast('Le chauffeur à disposition n’est pas proposé pour le moment.'); return; }
      if (!gammes.includes(d.veh)) d.veh = gammes[0];
      const total = HEURE_DISPO[d.veh] * d.heures;
      modale(`<h2>Chauffeur à disposition</h2><p>Votre chauffeur reste avec vous : rendez-vous, shopping, soirée. ${gammes.map((k, i) => `${euros(HEURE_DISPO[k])}${i ? '' : ' de l’heure'} en ${VEHICULES[k].nom.toLowerCase()}`).join(', ')}. 2 h minimum.</p>
        <div class="puces">${gammes.map((k) => `<button class="puce" type="button" data-a="dispoVeh" data-v="${k}" aria-pressed="${d.veh === k}">${VEHICULES[k].nom}</button>`).join('')}</div>
        <div class="champ"><span>Durée</span>${compteur('dispo-h', d.heures, ' h', 'dispoHeures')}</div>

    },
    dispoVeh(v) { etat.dispo.veh = v; actions.disposition(); },
    dispoHeures(d) { etat.dispo.heures = Math.min(12, Math.max(2, etat.dispo.heures + +d)); actions.disposition(); },
    reserverDispo() {
      const d = etat.dispo, quand = etat.planif || new Date(Date.now() + 60 * 60000), p = HEURE_DISPO[d.veh] * d.heures;
      fermerModale(); etat.arrivee = null; etat.itin = null; nouveauTrajet();
      const fiche = nouvelleFiche({ reserveLe: new Date(), prise: quand, veh: d.veh, chauffeur: null, km: 0, min: d.heures * 60, transport: p, dispo: d.heures, departCourt: etat.depart.titre, depart: titreLieu(etat.depart), arrivee: `À disposition ${d.heures} h`, arriveeCourt: 'À disposition' });
      etat.reservation = { quand: textePlanif(quand), trajet: `À disposition ${d.heures} h`, prix: p, vehicule: VEHICULES[d.veh].nom, agent: false, fiche };
      etat.aVenir.unshift(entreeActivite(fiche, 'Réservée'));
      aller('reservee');
    },
    commander() {
      const it = etat.itin;
      if (!it) return;
      const veh = etat.vehicule;
      if (etat.passager) toast(`Démo : ${etat.passager.prenom} reçoit un SMS avec le chauffeur, la plaque et le suivi.`);
      if (etat.planif) {
        const fiche = ficheTrajet(veh, it, etat.planif, null);
        consommerPromo(fiche);
        etat.reservation = { quand: textePlanif(etat.planif), trajet: `Vers ${etat.arrivee.titre}`, prix: fiche.transport + fiche.protection, vehicule: VEHICULES[veh].nom, agent: veh === 'vip', fiche };
        etat.aVenir.unshift(entreeActivite(fiche, 'Réservée'));
        aller('reservee'); return;
      }
      preparerCourse();
      const c = etat.course;
      c.promoAvant = etat.promo; consommerPromo(c.fiche);
      aller('recherche');
      const debut = performance.now();
      demander('loin', { bx: etat.depart.x, by: etat.depart.y, metres: 1200 + Math.random() * 900 }).then((r) => {
        if (etat.course !== c) return;
        c.rA = r ? trace(r.pts) : null;
        if (r) c.minApproche = Math.max(2, Math.min(9, Math.round(r.secondes / 60)));
        plus(Math.max(0, 3000 - (performance.now() - debut)), () => { if (etat.course !== c) return; c.tA0 = performance.now(); libre = false; aller('approche'); messageAuto('enRoute'); });
      });
    },
    annuler() {
      const c = etat.course;

      if (c && c.promoAvant) { etat.promo = c.promoAvant; ecrire('bda-app-promo', etat.promo); }
      etat.course = null; fermerChat(); fermerSuivi(); aller('choix'); toast('Course annulée. Aucun frais.');
    },
    abord() { const c = etat.course; c.tC0 = performance.now(); c.arriveePrevue = new Date(Date.now() + c.min * 60000); libre = false; son('clic'); aller('course'); },
    note(n) { etat.course.avis = val('#avis-texte'); etat.course.note = +n; son('clic'); rendu(null, true); },
    pourboire(n) { etat.course.avis = val('#avis-texte'); etat.course.pourboire = +n; son('clic'); rendu(null, true); },
    terminer() {
      const c = etat.course;
      Object.assign(c.fiche, { pourboire: c.pourboire, fin: c.arriveePrevue, note: c.note, avis: val('#avis-texte') || c.avis || '' });
      etat.passees.unshift(entreeActivite(c.fiche, 'Terminée'));
      // BDA Club : 1 point par euro de course
      const pts = Math.round(c.fiche.transport + c.fiche.protection), avant = niveauDe(etat.club.points);
      etat.club.points += pts; ecrire('bda-app-club', etat.club);
      const apres = niveauDe(etat.club.points);

      toast(apres !== avant ? `Bravo, vous passez au niveau ${apres.nom} du BDA Club !` : `Merci ! +${pts} points BDA Club. Votre reçu est dans Activité.`);
    },

        demander('route', { ax: x, ay: y, bx: etat.arrivee.x, by: etat.arrivee.y }).then((r) => {
          c.calculC = false; c.tReste = performance.now();
          if (!r || etat.course !== c) return;
          // le trajet affiché part de la vraie position de la voiture (comme dans l'appli du chauffeur)
          c.tr = trace(r.pts); c.fC = 0;
          c.reste = Math.max(1, Math.round(r.secondes / 60)); c.arriveePrevue = new Date(Date.now() + c.reste * 60000);
        });
      }
    }
  }
  function lisserVoiture(c, dt) {
    if (!c.pos || !c.cible) return;
    const f = 1 - Math.exp(-dt / 900);
    c.pos.u += (c.cible.u - c.pos.u) * f; c.pos.v += (c.cible.v - c.pos.v) * f;
    let d = c.cible.a - c.pos.a; d = Math.atan2(Math.sin(d), Math.cos(d)); c.pos.a += d * f;
  }
  // position sur un trajet : fraction parcourue (0 → 1) et distance en mètres au trajet
  function projeter(tr, u, v) { return procheSur(tr, u, v).f; }
  function distanceAuTrace(tr, u, v) { return procheSur(tr, u, v).d * METRES_PAR_U; }
  function procheSur(tr, u, v) {
    let best = Infinity, dist = 0;
    for (let i = 1; i < tr.n; i++) {
      const ax = tr.U[i - 1], ay = tr.V[i - 1], dx = tr.U[i] - ax, dy = tr.V[i] - ay, l2 = dx * dx + dy * dy;
      const t = l2 ? Math.max(0, Math.min(1, ((u - ax) * dx + (v - ay) * dy) / l2)) : 0;
      const ex = ax + t * dx - u, ey = ay + t * dy - v, d2 = ex * ex + ey * ey;
      if (d2 < best) { best = d2; dist = tr.cum[i - 1] + t * Math.sqrt(l2); }
    }
    return { f: tr.L ? dist / tr.L : 0, d: Math.sqrt(best) };
  }

    clearTimeout(minuteurSuivi);

  const cleVapid = (b64) => { const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, (ch) => ch.charCodeAt(0)); };
  async function activerNotifications(silencieux) {
    const possible = REEL && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && etat.config.vapid;
    if (!possible) { if (!silencieux) toast('Notifications indisponibles ici. Sur iPhone : ajoutez BDA à l’écran d’accueil, ouvrez l’appli depuis l’icône, puis réessayez.'); return false; }
    try {
      if (Notification.permission === 'denied') { if (!silencieux) toast('Notifications refusées : autorisez-les dans les réglages du téléphone.'); return false; }
      if (silencieux && Notification.permission !== 'granted') return false;
      const reg = await navigator.serviceWorker.ready;
      const abo = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: cleVapid(etat.config.vapid) });
      await api('push.abonner', abo.toJSON());
      etat.pushActif = true;
      if (!silencieux) { toast('Notifications activées sur ce téléphone.'); rendu(null, true); }
      return true;
    } catch (e) { if (!silencieux) toast('Impossible d’activer les notifications sur ce téléphone.'); return false; }
  }

  function dessinerSuiviPublic() {
    const cv = $('#suivi-toile'), d = suiviPublic && suiviPublic.d;

    if (!r.width) return;
    cv.width = Math.round(r.width * k); cv.height = Math.round(r.height * k);
    const c2 = cv.getContext('2d'); c2.setTransform(k, 0, 0, k, 0, 0);
    const pos = d.chauffeur && d.chauffeur.position, ref = pos || d.depart;
    if (!ref) return;
    const P = palette(), u = uDeX(qx(ref.lng)), v = vDeY(qy(ref.lat)), cam = camera(r.width, r.height, { u, v, z: 15 }, r.height / 2);
    dessinerBase(c2, cam, P);

  // Démarrage de la vraie appli : page de suivi d'un proche, lien « nouveau mot de passe », ou session enregistrée
  function demarrerReel() {
    const h = location.hash;
    let m = /^#suivi=([a-f0-9]{24})$/.exec(h);
    if (m) { modeSuiviPublic(m[1]); return; }
    // textes légaux lisibles sans compte (adresse demandée par l'App Store et Google Play)
    const textePublic = { '#confidentialite': 'politique', '#conditions': 'cgv', '#mentions': 'mentions' }[h];
    if (textePublic) {
      $('#lancement').hidden = true; connexion.hidden = true;
      chargerConfig().then(() => { etat.pile = []; aller(textePublic); nav.hidden = true; });
      aller(textePublic); nav.hidden = true;
      return;
    }
    chargerConfig().then(() => activerNotifications(true));
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
    m = /^#reset=([a-f0-9]{48})$/.exec(h);
    if (m) {
      history.replaceState(null, '', location.pathname + location.search);
      etat.auth = { ...nouvelleAuth(), etape: 'reset', jeton: m[1] };
      connexion.hidden = false; renduConnexion('#cx-mdp');
      return;
    }
    restaurerSession();
  }

    const el = e.target.closest('[data-a]');
    if (!el) return;
    const fn = actions[el.dataset.a];
    if (!fn) return;
    if (el.dataset.a === 'fermerModale') { fn(el.dataset.v, el, e); return; }

    if (champ && etat.champ !== champ) {
      etat.champ = champ;
      for (const [id, c] of Object.entries(CHAMP_DE)) {
        const el = $('#' + id); if (!el) continue;
        el.classList.toggle('actif', c === champ);
        if (c !== champ && c === 'depart') el.value = titreLieu(etat.depart);
        if (c !== champ && c === 'arret') el.value = titreLieu(etat.arret);

      if (champ === 'depart') { etat.filtreDepart = ''; e.target.value = ''; }
      if (champ === 'arret') { etat.filtreArret = ''; e.target.value = ''; }

    }

  });
  document.addEventListener('input', (e) => {

  });
  function majCases() {
    const champ = $('#cx-code');
    if (!champ) return;
    const v = champ.value, actif = document.activeElement === champ;
    champ.parentNode.querySelectorAll('span').forEach((s, i) => { s.textContent = v[i] || ''; s.classList.toggle('actif', actif && i === Math.min(v.length, 5)); });
  }
  document.addEventListener('focusout', () => setTimeout(majCases, 0));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && couche.innerHTML) fermerModale();
    if (e.key !== 'Enter') return;

    [/^([A-ZÉ][\wéèï-]+) arrive$/, '$1 is on the way'], [/^([A-ZÉ][\wéèï-]+) est arrivé$/, '$1 has arrived'], [/^([A-ZÉ][\wéèï-]+) est là$/, '$1 is here'],
    [/^Bonjour, je suis (.+), votre chauffeur BDA\. J’arrive dans (\d+) min\.$/, 'Hello, I’m $1, your BDA driver. I’ll be there in $2 min.'],
    [/^Je suis arrivé : (.+), plaque (.+)\.$/, (m, v, p) => `I’ve arrived: ${VOITURE_EN(v)}, plate ${p}.`],
    [/^Je suis juste devant, (.+)\.$/, (m, v) => `I’m right outside, ${VOITURE_EN(v)}.`],
    [/^(.+) est en route avec BDA$/, '$1 is on the way with BDA'], [/^(.+) arrive au point de départ\.$/, '$1 is heading to the pickup point.'], [/^(.+) est arrivé au point de départ\.$/, '$1 has reached the pickup point.'], [/^En route vers (.+)\.$/, 'On the way to $1.'],
    [/^Appeler (.+)$/, 'Call $1'], [/^(.+) · chauffeur vérifié$/, '$1 · verified driver'], [/^Votre avis sur (.+)$/, 'Rate $1'], [/^Un mot pour (.+) \(facultatif\)$/, 'A note for $1 (optional)'],
    [/^Un pourboire \? Il est reversé entièrement à (.+)\.$/, 'Add a tip? It all goes to $1.'], [/^(.+) est dans vos favoris$/, '$1 is in your favourites'], [/^Ajouter (.+) à mes chauffeurs favoris$/, 'Add $1 to my favourite drivers'],
    [/^(\d) étoiles?$/, (m, n) => `${n} star${n === '1' ? '' : 's'}`], [/^Saisissez le code à 6 chiffres envoyé à (.+)$/, 'Enter the 6-digit code sent to $1'],
    [/^(.+)\. Attente offerte pendant (\d+) minutes\.$/, (m, v, n) => `${VOITURE_EN(v)}. Free waiting time: ${n} minutes.`],
    [/^Votre chauffeur demandera (.+), qui a reçu le suivi par SMS \(démo\)\.$/, 'Your driver will ask for $1, who got the tracking by text (demo).'],
    [/^Pour (.+)$/, 'For $1'], [/^Favori : (.+)$/, 'Favourite: $1'], [/^Vol (.+) suivi\.(.*)$/, (m, v, r) => `Flight ${v} tracked.${r ? ' Your driver waits for you in arrivals with a name sign.' : ''}`], [/^Vol (.+)$/, 'Flight $1'],
    [/^Code (.+)$/, 'Code $1'], [/^Arrêt : (.+)$/, 'Stop: $1'], [/^Merci ! \+(\d+) points BDA Club\. Votre reçu est dans Activité\.$/, 'Thank you! +$1 BDA Club points. Your receipt is in Activity.'],
    [/^Bravo, vous passez au niveau (\w+) du BDA Club !$/, 'Congratulations, you’ve reached BDA Club $1!'], [/^Bienvenue, (.+) !(.*)$/, (m, p) => `Welcome, ${p}!`],
    [/^Code (.+) appliqué : (.+) de réduction sur votre prochaine course\.$/, 'Code $1 applied: $2 off your next ride.'], [/^Démo : (.+) reçoit un SMS avec le chauffeur, la plaque et le suivi\.$/, 'Demo: $1 gets a text with the driver, plate and tracking.'],
    [/^Course pour (.+)\. Votre chauffeur demandera (.+) à la prise en charge\.$/, 'Ride for $1. Your driver will ask for $2 at pickup.'], [/^Réservation pour (.+)\. Choisissez votre destination\.$/, 'Booking for $1. Choose your destination.'],
    [/^(.+) : disponible dans la vraie appli\.$/, '$1: available in the real app.'], [/^Démo : lien de suivi envoyé à (.+)\.$/, 'Demo: tracking link sent to $1.'],
  ];
  const ORIGINAUX = new WeakMap();
  function traduireTexte(s) {
    s = s.replace(/[  ]/g, ' ');
    if (EN.has(s)) return EN.get(s);
    for (const [re, f] of MOTIFS_EN) {
      const m = s.match(re);
      if (!m) continue;
      const r = typeof f === 'function' ? f(...m) : s.replace(re, f);
      if (r != null) return r;
    }
    if (s.includes(' · ')) { const parts = s.split(' · '), t = parts.map((p) => traduireTexte(p) ?? p); if (t.some((x, i) => x !== parts[i])) return t.join(' · '); }
    if (/Mercedes|Tesla/.test(s)) { const r = VOITURE_EN(s); return r !== s ? r : null; }
    return null;
  }
  const tr = (s) => (etat.langue === 'en' ? traduireTexte(s) ?? s : s);
  const horsTraduction = (n) => { const p = n.nodeType === 1 ? n : n.parentElement; return !!(p && p.closest('.texte-legal, .doc-emetteur, .doc-note, .mention-cnaps, script, style')); };
  function traduireNoeudTexte(n) {
    const v = n.nodeValue, s = v.trim();
    if (!s || horsTraduction(n)) return;
    const r = traduireTexte(s);
    if (r == null || r === s) return;
    if (!ORIGINAUX.has(n)) ORIGINAUX.set(n, v);
    n.nodeValue = v.replace(s, r);
  }
  function traduireElement(racine) {
    if (horsTraduction(racine)) return;
    const w = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) traduireNoeudTexte(n);
    const els = racine.querySelectorAll ? [racine, ...racine.querySelectorAll('[placeholder],[aria-label]')] : [];
    for (const el of els) for (const a of ['placeholder', 'aria-label']) {
      const v = el.getAttribute && el.getAttribute(a);
      if (!v) continue;
      const r = traduireTexte(v.trim());
      if (r == null || r === v) continue;
      const o = ORIGINAUX.get(el) || {}; if (!(a in o)) o[a] = v; ORIGINAUX.set(el, o);
      el.setAttribute(a, r);
    }
  }
  const observateurLangue = new MutationObserver((muts) => {
    if (etat.langue !== 'en') return;
    for (const m of muts) {
      if (m.type === 'characterData') traduireNoeudTexte(m.target);
      else for (const n of m.addedNodes) { if (n.nodeType === 3) traduireNoeudTexte(n); else if (n.nodeType === 1) traduireElement(n); }
    }
  });
  observateurLangue.observe(appareil, { childList: true, subtree: true, characterData: true });
  function traduireTout() {
    document.title = etat.langue === 'en' ? 'BDA app' : 'Appli BDA';
    if (etat.langue === 'en') { traduireElement(appareil); return; }
    // retour au français : on remet les textes d'origine des éléments fixes, puis on redessine les écrans
    const w = document.createTreeWalker(appareil, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) if (ORIGINAUX.has(n)) n.nodeValue = ORIGINAUX.get(n);
    appareil.querySelectorAll('[placeholder],[aria-label]').forEach((el) => { const o = ORIGINAUX.get(el); if (o && typeof o === 'object') for (const [a, v] of Object.entries(o)) el.setAttribute(a, v); });
    if (!connexion.hidden) renduConnexion();
  }

  /* ================= Démarrage ================= */
  // traînées de phares de l'ouverture : tracé, départ (s), durée (s), dorée ou non
  const TRAITS = [
    ['M-60 610C90 560 150 470 210 452S330 400 470 330', 0, 1.1],
    ['M470 560C330 520 250 470 200 440S70 360 -60 350', 0.12, 1.15],
    ['M-60 500C100 480 300 470 470 430', 0.2, 0.95, 1],
    ['M-60 740C120 640 220 520 260 470S360 320 470 260', 0.3, 1.2],
    ['M470 700C320 620 180 520 140 460S60 300 -60 220', 0.38, 1.25],
    ['M-60 400C120 440 280 420 470 380', 0.5, 0.9],
    ['M470 470C300 455 120 430 -60 470', 0.6, 0.95, 1],
    ['M-60 300C80 360 220 410 470 520', 0.68, 1],
    ['M470 620C300 560 120 520 -60 560', 0.95, 1.1, 0, 1],
    ['M-60 450C140 420 260 400 470 410', 1.1, 1.05, 1, 1],
    ['M470 330C320 360 140 380 -60 420', 1.3, 1.1, 0, 1],
  ];
  $('#l-traits').innerHTML = TRAITS.map(([d, t, duree, or, loin]) => `<g class="l-trait${or ? ' or' : ''}${loin ? ' loin' : ''}" style="--t:${t}s;--d:${duree}s">${['queue', 'lueur', 'coeur'].map((c) => `<path class="l-${c}" pathLength="1000" d="${d}"/>`).join('')}</g>`).join('');
  function demarrerOuverture(l) {
    const go = () => { l.classList.add('go'); setTimeout(() => { if (l.isConnected) l.hidden = true; }, 3650); };
    const police = document.fonts && document.fonts.load ? document.fonts.load('800 92px Manrope') : Promise.resolve();
    Promise.race([police, new Promise((ok) => setTimeout(ok, 900))]).then(go, go);
  }
  function lancerOuverture() {
    const ancien = $('#lancement'), copie = ancien.cloneNode(true);
    copie.hidden = false; copie.classList.remove('fini', 'go'); ancien.replaceWith(copie);
    demarrerOuverture(copie);
  }
  if (location.hostname === 'localhost') window.__bda = { etat, vue, cible, D, moteur, zone: () => zone, libre: () => libre, actions, rendu, aller, pages: Object.keys(PAGES), vues: Object.keys(VUES_CARTE), renduConnexion, icones: ICONES };
  etat.passees = REEL ? [] : exemplesActivite();
  appliquerAffichage();
  setInterval(majDirect, 200);
  requestAnimationFrame(boucle);
  demarrerMoteur();
  if (REEL) for (const v of Object.values(VEHICULES)) v.attente = null; // délais réels donnés par les chauffeurs en ligne
  rendu();
  if (REEL) demarrerReel(); else if (!etat.user) montrerConnexion();
  if (etat.langue === 'en') appliquerLangue();
  if (!suiviPublic) demarrerOuverture($('#lancement'));
  chargerCarte();
})();
